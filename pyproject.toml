[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-pipeline"
version = "0.1.0"
description = "Automated invoice processing: folder/email trigger, strict LLM extraction, Postgres audit trail and notifications"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.5",
  "uvicorn[standard]==0.32.1",
  "python-multipart==0.0.17",
  "psycopg[binary,pool]==3.2.3",
  "pydantic==2.10.3",
  "httpx==0.28.1",
  "pypdf==5.1.0",
  "pypdfium2==4.30.0",
  "pytesseract==0.3.13",
  "pillow==11.0.0",
  "prometheus-client==0.21.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "ruff==0.8.4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["samples", "web"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
